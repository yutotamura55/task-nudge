name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - run: scripts/check.sh
      - name: Upload debug APK (best effort)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        continue-on-error: true
        with:
          name: task-nudge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 3
      - name: Upload host test results (best effort)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        continue-on-error: true
        with:
          name: host-test-results
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 3

  android-device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Free space for Android emulator
        run: sudo rm -rf /opt/hostedtoolcache/CodeQL
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: scripts/device-smoke.sh
      - name: Upload Android test results (best effort)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        continue-on-error: true
        with:
          name: android-test-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            build/device-screenshots/
          if-no-files-found: warn
          retention-days: 3
