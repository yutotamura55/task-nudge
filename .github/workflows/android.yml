name: Android

on:
  pull_request:
    # ready_for_review runs the emulator tests once when a draft PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name keeps a manual run and a merge push on main from cancelling each other.
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change touches anything besides documents (*.md, docs/**).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # File names only: full history without file contents.
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            # The checkout is the PR merged into main; its first parent is that main.
            pull_request) range="HEAD^1..HEAD" ;;
            push) range="$PUSH_BEFORE..$GITHUB_SHA" ;;
            *) range="" ;;
          esac
          # Manual runs, new branches and unreadable ranges count as code changes.
          # --no-renames lists both paths of a move; quotePath=false keeps Japanese names unquoted.
          if [[ -z "$range" || "$PUSH_BEFORE" =~ ^0+$ ]] || ! files="$(git -c core.quotePath=false diff --name-only --no-renames "$range")"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if grep -q -v -E '(\.md$|^docs/)' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - run: scripts/check.sh
      - name: Upload debug APK (best effort)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        continue-on-error: true
        with:
          name: task-nudge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 3
      - name: Upload host test results (best effort)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        continue-on-error: true
        with:
          name: host-test-results
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            core/build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 3

  # Skipped for draft PRs and document-only changes. A job skipped by `if` reports
  # success, so it does not leave a required check pending. If `changes` fails, run
  # anyway rather than skip on an unknown change.
  android-device-tests:
    needs: changes
    if: >-
      ${{ !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Free space for Android emulator
        run: sudo rm -rf /opt/hostedtoolcache/CodeQL
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: scripts/device-smoke.sh
      - name: Upload Android test results (best effort)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        continue-on-error: true
        with:
          name: android-test-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            build/device-screenshots/
          if-no-files-found: warn
          retention-days: 3
